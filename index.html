<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#081a12" />
    <meta name="description" content="吞噬进化：从一只普通蚂蚁开始，繁衍蚁群并吞噬世界。" />
    <title>吞噬进化</title>
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; background: radial-gradient(circle at 50% 36%, #264a35 0, #0b2118 38%, #050c08 100%); color: #f5edbd; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; transition: opacity .35s ease, visibility .35s ease; }
      #boot-loader.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-card { width: min(78vw, 330px); text-align: center; }
      .boot-mark { width: 62px; height: 62px; margin: 0 auto 18px; border: 2px solid #bceca6; border-radius: 50%; display: grid; place-items: center; color: #bceca6; font-size: 29px; box-shadow: 0 0 24px #6aca7870; animation: boot-pulse 1.5s ease-in-out infinite alternate; }
      .boot-title { font-weight: 800; font-size: 25px; letter-spacing: 2px; }
      .boot-status { min-height: 24px; margin: 9px 0 17px; color: #b9d6a8; font-size: 13px; }
      .boot-track { height: 8px; overflow: hidden; border: 1px solid #92c67e; border-radius: 99px; background: #07120c; }
      .boot-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #5bc87e, #d7f495); transition: width .14s linear; }
      .boot-percent { margin-top: 9px; color: #e6f3cb; font-weight: 800; font-size: 13px; }
      @keyframes boot-pulse { from { transform: scale(.93); opacity: .68; } to { transform: scale(1.05); opacity: 1; } }
    </style>
    <script type="module" crossorigin src="./assets/index-Ck-M1V6D.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B3RjsWOp.css">
  </head>
  <body>
    <div id="game" data-project="ant-devour-mvp"></div>
    <section id="boot-loader" aria-live="polite" aria-label="游戏加载中">
      <div class="boot-card">
        <div class="boot-mark">✦</div>
        <div class="boot-title">正在唤醒虫巢</div>
        <div class="boot-status" data-boot-status>正在准备战场资源</div>
        <div class="boot-track"><div class="boot-fill" data-boot-fill></div></div>
        <div class="boot-percent" data-boot-percent>0%</div>
      </div>
    </section>
  </body>
</html>
